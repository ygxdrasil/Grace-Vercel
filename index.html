<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04090f" />
    <meta name="description" content="Grace — a personal assistant with a memory." />
    <title>Grace</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      There is one theme, and it is dark.

      This used to follow the operating system, and that was right when she
      was a page with a conversation on it. She is an instrument panel now,
      and an instrument panel on a white background is not a lighter version
      of the same thing — it is a different object, and a worse one. Every
      readout here works by being dim against black, with the two or three
      lit things carrying all the meaning. On white there is nothing for them
      to be lit against.

      Set here rather than in React because by the time React mounts a frame
      has already been painted, and a flash of the wrong background on every
      load is impossible to unsee once noticed.
    -->
    <script>
      document.documentElement.dataset.theme = 'dark';
      document.documentElement.style.colorScheme = 'dark';
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
